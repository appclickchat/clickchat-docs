<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get ClickChat</title>

  <!-- ============================================================
       CONFIG — edit these two lines only
       ============================================================ -->
  <script>
    // Android: Play Store listing (package name)
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.clickchat.android";
    // iOS: App Store listing.
    var IOS_APP_ID  = "6775589600";
    var IOS_URL     = "https://apps.apple.com/app/id" + IOS_APP_ID;
  </script>

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1226; color: #fff; text-align: center; padding: 24px;
    }
    h1 { font-size: 1.6rem; margin: 16px 0 4px; }
    p  { opacity: .8; margin: 0 0 28px; }
    .logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    a.btn {
      display: block; padding: 15px 20px; border-radius: 14px;
      text-decoration: none; font-weight: 600; font-size: 1rem;
      background: #4f6bff; color: #fff; transition: transform .1s ease, opacity .2s;
    }
    a.btn.secondary { background: rgba(255,255,255,.12); }
    a.btn:active { transform: scale(.97); }
    .note { margin-top: 22px; font-size: .8rem; opacity: .55; }
  </style>
</head>
<body>
  <img class="logo" src="AppLogo.png" alt="ClickChat" onerror="this.style.display='none'">
  <h1>ClickChat</h1>
  <p>Opening your app store…</p>

  <div class="btns">
    <a id="ios"     class="btn" href="#">Download on the App Store</a>
    <a id="android" class="btn secondary" href="#">Get it on Google Play</a>
  </div>

  <p class="note">If nothing happens, tap the button for your device.</p>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || "";
      var isIOS     = /iPad|iPhone|iPod/.test(ua) ||
                      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
      var isAndroid = /android/i.test(ua);

      document.getElementById("ios").href     = IOS_URL;
      document.getElementById("android").href = ANDROID_URL;

      // Auto-redirect on mobile; desktop shows both buttons.
      if (isAndroid) {
        window.location.replace(ANDROID_URL);
      } else if (isIOS) {
        window.location.replace(IOS_URL);
      }
    })();
  </script>
</body>
</html>
